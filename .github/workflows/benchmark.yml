name: Benchmarks

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-unix:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
          os: [macos-latest, ubuntu-latest]

    env:
      NUGET_XMLDOC_MODE: skip
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare MacOS Installation
        if: matrix.os == 'macos-latest'
        run: |
          echo "Uninstall CMake"
          brew uninstall --force cmake

          echo "Uninstall NodeJS and NPM"
          npm uninstall npm -g
          rm -rf /usr/local/lib/node_modules/npm

          echo "Uninstall Ruby"
          brew uninstall --force --ignore-dependencies ruby
          brew cleanup -s ruby
          brew cleanup --prune-prefix
          RUBY_FRAMEWORK_DIR=$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks/Ruby.framework
          sudo rm -rf $RUBY_FRAMEWORK_DIR

          echo "Uninstall Go"
          brew uninstall --force go
          brew autoremove
          sudo rm -rf /usr/local/Cellar/go
          sudo rm -rf /usr/local/go
          sudo rm -rf /usr/local/opt/go
          sudo rm -rf /etc/paths.d/go
          sudo rm -rf /usr/local/bin/go
          sudo rm -rf /usr/local/bin/gofmt

          echo "Uninstall Java"
          sudo rm -rf /Library/Java/JavaVirtualMachines/*
          sudo rm -rf /Library/Internet\ Plug-Ins/JavaAppletPlugin.plugin
          sudo rm -rf /Library/PreferencePanes/JavaControlPanel.prefPane
          unset JAVA_HOME

          echo "Export XCode SDK Root"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

      # TODO: Add support for NetCore Bench
      - name: Set up the environment
        run: |
          sh ./tools/metacall-environment.sh $METACALL_INSTALL_OPTIONS
        env:
          METACALL_INSTALL_OPTIONS: base python nodejs ruby # TODO: Implement NetCore once it works with MacOS

      - name: Configure 
        run: |
          mkdir -p build
          cd build
          if [ "$(uname)" == "Darwin" ]; then
            . .env
          fi
          bash ../tools/metacall-configure.sh $METACALL_CONFIGURE_OPTIONS
        env:
          METACALL_CONFIGURE_OPTIONS: release scripts python nodejs ruby benchmarks # TODO: Implement NetCore once it works with MacOS

      - name: Build 
        working-directory: ./build
        run: |
          if [ "$(uname)" == "Darwin" ]; then
            . .env
          fi
          bash ../tools/metacall-build.sh $METACALL_BUILD_OPTIONS
        env:
          METACALL_BUILD_OPTIONS: release benchmarks

      - name: Merge benchmarks
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 ./tools/metacall-benchmarks-merge.py ./build/benchmarks

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: benchmark-${{ matrix.os }}
          path: ./build/benchmarks/metacall-benchmarks.json
          if-no-files-found: error

  benchmark-windows:
    runs-on: ${{ matrix.os }}
    strategy:
        fail-fast: false
        matrix:
          os: [windows-2022, windows-2025]

    env:
      NUGET_XMLDOC_MODE: skip
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate the Visual Studio Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up the environment
        run: cmd.exe /c "powershell .\tools\metacall-environment.ps1 $Env:METACALL_INSTALL_OPTIONS"
        env:
          METACALL_INSTALL_OPTIONS: python nodejs ruby # TODO: Implement NetCore once it works with Windows

      # TODO: Use release when this bug is solved: https://github.com/metacall/core/issues/461
      - name: Configure
        run: |
          $METACALL_PATH = $PWD
          md -Force "$METACALL_PATH\build"
          cd "$METACALL_PATH\build"
          cmd.exe /c "powershell ..\tools\metacall-configure.ps1 $Env:METACALL_BUILD_OPTIONS"
        env:
          METACALL_BUILD_OPTIONS: debug scripts python nodejs ruby benchmarks # TODO: Implement NetCore once it works with Windows

      # TODO: Use release when this bug is solved: https://github.com/metacall/core/issues/461
      - name: Build
        working-directory: ./build
        run: cmd.exe /c "powershell ..\tools\metacall-build.ps1 $Env:METACALL_BUILD_OPTIONS"
        env:
          METACALL_BUILD_OPTIONS: debug benchmarks

      - name: Merge benchmarks
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 ./tools/metacall-benchmarks-merge.py ./build/benchmarks

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: benchmark-${{ matrix.os }}
          path: ./build/benchmarks/metacall-benchmarks.json
          if-no-files-found: error

  benchmark-push:
    needs: [benchmark-unix, benchmark-windows]
    # Push the results that are available even if some of the benchmarks failed
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the benchmarks repository
        uses: actions/checkout@v4
        with:
          repository: metacall/core-benchmarks
          ref: main
          # Access token to push into the benchmarks repository
          token: ${{ secrets.BENCHMARKS_PUSH_TOKEN }}

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-*
          path: results

      - name: Store benchmark result (macos-latest)
        uses: benchmark-action/github-action-benchmark@v1
        if: ${{ hashFiles('results/benchmark-macos-latest/metacall-benchmarks.json') != '' }}
        with:
            name: MetaCall Benchmark (macos-latest)
            tool: 'googlecpp'
            output-file-path: ./results/benchmark-macos-latest/metacall-benchmarks.json
            # Commit into the core-benchmarks checkout of the workspace, push is done once at the end
            skip-fetch-gh-pages: true
            auto-push: false
            # Github Pages branch name
            gh-pages-branch: main
            # Output directory
            benchmark-data-dir-path: ./macos-latest

      - name: Store benchmark result (ubuntu-latest)
        uses: benchmark-action/github-action-benchmark@v1
        if: ${{ hashFiles('results/benchmark-ubuntu-latest/metacall-benchmarks.json') != '' }}
        with:
            name: MetaCall Benchmark (ubuntu-latest)
            tool: 'googlecpp'
            output-file-path: ./results/benchmark-ubuntu-latest/metacall-benchmarks.json
            # Commit into the core-benchmarks checkout of the workspace, push is done once at the end
            skip-fetch-gh-pages: true
            auto-push: false
            # Github Pages branch name
            gh-pages-branch: main
            # Output directory
            benchmark-data-dir-path: ./ubuntu-latest

      - name: Store benchmark result (windows-2022)
        uses: benchmark-action/github-action-benchmark@v1
        if: ${{ hashFiles('results/benchmark-windows-2022/metacall-benchmarks.json') != '' }}
        with:
            name: MetaCall Benchmark (windows-2022)
            tool: 'googlecpp'
            output-file-path: ./results/benchmark-windows-2022/metacall-benchmarks.json
            # Commit into the core-benchmarks checkout of the workspace, push is done once at the end
            skip-fetch-gh-pages: true
            auto-push: false
            # Github Pages branch name
            gh-pages-branch: main
            # Output directory
            benchmark-data-dir-path: ./windows-2022

      - name: Store benchmark result (windows-2025)
        uses: benchmark-action/github-action-benchmark@v1
        if: ${{ hashFiles('results/benchmark-windows-2025/metacall-benchmarks.json') != '' }}
        with:
            name: MetaCall Benchmark (windows-2025)
            tool: 'googlecpp'
            output-file-path: ./results/benchmark-windows-2025/metacall-benchmarks.json
            # Commit into the core-benchmarks checkout of the workspace, push is done once at the end
            skip-fetch-gh-pages: true
            auto-push: false
            # Github Pages branch name
            gh-pages-branch: main
            # Output directory
            benchmark-data-dir-path: ./windows-2025

      - name: Push benchmark results
        run: git push origin main
