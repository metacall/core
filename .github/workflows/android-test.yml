name: Android Test

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android NDK Build
    runs-on: ubuntu-latest

    # TODO: Add more architectures
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64]
        api-level: [33]
        build: [debug]

    env:
      ANDROID_NDK_VERSION: "26.1.10909125"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: ./tools/metacall-environment.sh ${{ matrix.build }} base android

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake for Android
        working-directory: ./build
        env:
          ANDROID_API_LEVEL: ${{ matrix.api-level }}
          ANDROID_ABI: ${{ matrix.abi }}
        run: ../tools/metacall-configure.sh ${{ matrix.build }} base android scripts tests

      # Tests cannot run on the host, they are executed in the emulator job
      - name: Build
        working-directory: ./build
        run: ../tools/metacall-build.sh ${{ matrix.build }}

      # Use a tarball because upload-artifact does not preserve file permissions
      - name: Package build
        run: tar -czf android-build.tar.gz build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ matrix.abi }}-api${{ matrix.api-level }}-${{ matrix.build }}
          path: android-build.tar.gz
          retention-days: 7

  android-emulator-test:
    name: Android Emulator Test
    needs: android-build
    runs-on: ubuntu-latest

    # TODO: Add more architectures
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64]
        api-level: [33]
        build: [debug]
        target: [google_apis]

    env:
      ANDROID_NDK_VERSION: "26.1.10909125"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: ./tools/metacall-environment.sh ${{ matrix.build }} base android

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build-${{ matrix.abi }}-api${{ matrix.api-level }}-${{ matrix.build }}

      # Touch extracted files so they are newer than the checkout and the build is not redone
      - name: Extract build
        run: tar -xzmf android-build.tar.gz

      # The build uses ANDROID_STL=c++_shared, so the C++ runtime must be pushed with the binaries
      - name: Copy C++ runtime
        run: |
          case "${{ matrix.abi }}" in
            x86_64) ANDROID_TRIPLET=x86_64-linux-android;;
            *) echo "Unsupported ABI: ${{ matrix.abi }}"; exit 1;;
          esac
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$ANDROID_TRIPLET/libc++_shared.so" build/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.abi }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Each line of the script runs as a separate command
          script: |
            adb shell "mkdir -p /data/local/tmp/metacall"
            adb push build /data/local/tmp/metacall/
            cd build && ../tools/metacall-build.sh ${{ matrix.build }} tests
