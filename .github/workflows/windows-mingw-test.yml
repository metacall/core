name: Windows MinGW Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - develop
    tags:
      - v*.*.*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mingw-test:
    name: Windows MinGW Test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: mingw64, env: x86_64 }
          - { sys: mingw32, env: i686 }
          - { sys: ucrt64,  env: ucrt-x86_64 }
          - { sys: clang64, env: clang-x86_64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2.30.0
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >
            mingw-w64-${{ matrix.env }}-gcc
          pacboy: >
            toolchain:p
            cmake:p
            make:p
            gdb:p

      - name: Build and Test
        shell: msys2 {0}
        run: |
            sh ./tools/metacall-environment.sh base
            export CFLAGS="-Og -g -fno-omit-frame-pointer"
            export CXXFLAGS="-Og -g -fno-omit-frame-pointer"
            mkdir -p build && cd build
            sh ../tools/metacall-configure.sh debug tests
            sh ../tools/metacall-build.sh debug
            ctest -R '^metacall-load-configuration-test$' --timeout 300 &
            CTPID=$!
            sleep 90
            WPID=$(ps -W | grep 'metacall-load-configuration-test' | awk '{print $4}' | head -1)
            gdb -p "$WPID" --batch \
              -ex "set pagination off" \
              -ex "set backtrace past-main on" \
              -ex "info threads" \
              -ex "thread apply all bt full" \
              -ex "detach" -ex "quit" || true
            kill -9 $CTPID || true