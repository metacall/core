  name: libffi MSVC investigation

  on:
    workflow_dispatch:

  jobs:
    build-libffi:
      runs-on: windows-2022

      steps:
        - name: Activate MSVC
          uses: ilammy/msvc-dev-cmd@v1
          with:
            arch: amd64

        - name: Download and inspect libffi
          shell: pwsh
          run: |
            $Version = "3.5.2"
            $Archive = "$env:RUNNER_TEMP\libffi-$Version.tar.gz"
            $Source = "$env:RUNNER_TEMP\libffi-$Version"
            $Build = "$env:RUNNER_TEMP\libffi-build"
            $Install = "$env:RUNNER_TEMP\libffi-install"

            Invoke-WebRequest `
              "https://github.com/libffi/libffi/releases/download/v$Version/libffi-$Version.tar.gz" `
              -OutFile $Archive

            $Expected = "f3a3082a23b37c293a4fcd1053147b371f2ff91fa7ea1b2a52e335676bac82dc"
            $Actual = (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLower()

            if ($Actual -ne $Expected) {
              throw "Checksum mismatch: expected $Expected, got $Actual"
            }

            tar -xzf $Archive -C $env:RUNNER_TEMP

            $Required = @(
              "configure",
              "msvcc.sh",
              "ltmain.sh",
              "compile",
              "missing",
              "install-sh",
              "config.guess",
              "config.sub"
            )

            foreach ($File in $Required) {
              if (!(Test-Path "$Source\$File")) {
                throw "Missing required file: $Source\$File"
              }
            }

            New-Item -ItemType Directory -Force $Build, $Install

            "LIBFFI_SRC=$Source" >> $env:GITHUB_ENV
            "LIBFFI_BUILD=$Build" >> $env:GITHUB_ENV
            "LIBFFI_INSTALL=$Install" >> $env:GITHUB_ENV

        - name: Inspect Windows and Git Bash paths
          shell: pwsh
          run: |
            Write-Host "PowerShell source path: $env:LIBFFI_SRC"

            & "C:\Program Files\Git\bin\bash.exe" -lc @'
            set -eux

            src="$(cygpath -u "$LIBFFI_SRC")"
            build="$(cygpath -u "$LIBFFI_BUILD")"
            install="$(cygpath -u "$LIBFFI_INSTALL")"

            printf "src=%s\nbuild=%s\ninstall=%s\n" \
              "$src" "$build" "$install"

            test -f "$src/configure"
            test -f "$src/msvcc.sh"
            test -f "$src/ltmain.sh"
            test -f "$src/compile"
            test -f "$src/missing"
            test -f "$src/install-sh"
            test -f "$src/config.guess"
            test -f "$src/config.sub"
            '@

        - name: Inspect build tools
          shell: pwsh
          run: |
            where.exe cl
            where.exe link
            where.exe ml64
            where.exe bash

            $Make = Get-Command make -ErrorAction SilentlyContinue
            if (!$Make) {
              throw "GNU make is unavailable on this runner"
            }

            where.exe make

        - name: Configure and build libffi
          shell: pwsh
          run: |
            & "C:\Program Files\Git\bin\bash.exe" -lc @'
            set -euxo pipefail

            src="$(cygpath -u "$LIBFFI_SRC")"
            build="$(cygpath -u "$LIBFFI_BUILD")"
            install="$(cygpath -u "$LIBFFI_INSTALL")"

            # The release archive already contains generated Autotools files.
            # Avoid timestamp rounding on Windows triggering their regeneration.
            find "$src" -name Makefile.in -exec touch {} +

            cd "$build"

            "$src/configure" \
              CC="$src/msvcc.sh -m64" \
              CXX="$src/msvcc.sh -m64" \
              LD=link \
              CPP="cl -nologo -EP" \
              CXXCPP="cl -nologo -EP" \
              CPPFLAGS="-DFFI_BUILDING_DLL" \
              --disable-docs \
              --prefix="$install"

            make V=1 \
              SHELL=/bin/sh \
              AUTOMAKE=true \
              ACLOCAL=true \
              AUTOCONF=true \
              AUTOHEADER=true

            make install \
              SHELL=/bin/sh \
              AUTOMAKE=true \
              ACLOCAL=true \
              AUTOCONF=true \
              AUTOHEADER=true

            find "$install" -maxdepth 4 -type f -print
            '@

            if ($LASTEXITCODE -ne 0) {
              throw "libffi build/install failed with exit code $LASTEXITCODE"
            }

        - name: Verify installation
          shell: pwsh
          run: |
            Get-ChildItem $env:LIBFFI_INSTALL -Recurse

            $Header = Get-ChildItem `
              $env:LIBFFI_INSTALL -Recurse -Filter ffi.h |
              Select-Object -First 1

            $Library = Get-ChildItem `
              $env:LIBFFI_INSTALL -Recurse -Filter *.lib |
              Where-Object Name -Match '^libffi' |
              Select-Object -First 1

            if (!$Header) {
              throw "ffi.h was not installed"
            }

            if (!$Library) {
              throw "No libffi MSVC library was installed"
            }

            Write-Host "Header: $($Header.FullName)"
            Write-Host "Library: $($Library.FullName)"
            dumpbin /headers $Library.FullName

        - name: Upload investigation results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: libffi-msvc-investigation
            path: |
              ${{ runner.temp }}/libffi-build/config.log
              ${{ runner.temp }}/libffi-install
