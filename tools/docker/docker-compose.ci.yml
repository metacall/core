#
#	MetaCall Library by Parra Studios
#	Layer cache transport for the registry backend, one ref per instrumentation scope.
#

services:
  deps:
    build:
      cache_from:
        - type=registry,ref=${METACALL_CACHE_REF}
      cache_to:
        - type=registry,ref=${METACALL_CACHE_REF},mode=max,ignore-error=true

  dev:
    build:
      cache_from:
        - type=registry,ref=${METACALL_CACHE_REF}
      cache_to:
        - type=registry,ref=${METACALL_CACHE_REF},mode=max,ignore-error=true

  runtime:
    build:
      cache_from:
        - type=registry,ref=${METACALL_CACHE_REF}
      cache_to:
        - type=registry,ref=${METACALL_CACHE_REF},mode=max,ignore-error=true

  cli:
    build:
      cache_from:
        - type=registry,ref=${METACALL_CACHE_REF}
      cache_to:
        - type=registry,ref=${METACALL_CACHE_REF},mode=max,ignore-error=true
